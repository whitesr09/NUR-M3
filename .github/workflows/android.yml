name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_RELEASE_KEYSTORE: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.NUR_RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Test and build stable debug APK
        run: gradle --no-daemon --no-parallel --stacktrace testDebugUnitTest assembleDebug
      - name: Build optimized preview APK
        run: gradle --no-daemon --no-parallel --stacktrace assembleOptimized
      - name: Verify preview signing certificates
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/optimized/app-optimized.apk
      - name: Prepare private release keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          NUR_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUR_RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystores
          printf '%s' "$NUR_RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystores/nur-m3-release.jks
          chmod 600 app/keystores/nur-m3-release.jks
      - name: Build private release APK
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          NUR_RELEASE_STORE_FILE: keystores/nur-m3-release.jks
          NUR_RELEASE_STORE_PASSWORD: ${{ secrets.NUR_RELEASE_STORE_PASSWORD }}
          NUR_RELEASE_KEY_ALIAS: ${{ secrets.NUR_RELEASE_KEY_ALIAS }}
          NUR_RELEASE_KEY_PASSWORD: ${{ secrets.NUR_RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --no-parallel --stacktrace assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Upload stable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NUR-M3-stable-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload optimized preview APK
        uses: actions/upload-artifact@v4
        with:
          name: NUR-M3-optimized-preview
          path: app/build/outputs/apk/optimized/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload release APK
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: NUR-M3-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
