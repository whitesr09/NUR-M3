name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.NUR_RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Test and build stable debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify debug signing certificate
        run: apksigner verify --print-certs app/build/outputs/apk/debug/*.apk
      - name: Prepare private release keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          NUR_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUR_RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystores
          printf '%s' "$NUR_RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystores/nur-m3-release.jks
      - name: Build private release APK
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          NUR_RELEASE_STORE_FILE: keystores/nur-m3-release.jks
          NUR_RELEASE_STORE_PASSWORD: ${{ secrets.NUR_RELEASE_STORE_PASSWORD }}
          NUR_RELEASE_KEY_ALIAS: ${{ secrets.NUR_RELEASE_KEY_ALIAS }}
          NUR_RELEASE_KEY_PASSWORD: ${{ secrets.NUR_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NUR-M3-stable-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload release APK
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: NUR-M3-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
